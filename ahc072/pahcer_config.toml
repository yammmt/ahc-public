[general]
version = "0.4.0"

[problem]
problem_name = "ahc072"
objective = "Min"
score_regex = '(?m)^\s*Score\s*=\s*(?P<score>\d+)\s*$'

[test]
start_seed = 0
end_seed = 100
threads = 4
out_dir = "./pahcer"

# ==============================
#         COMPILE STEPS
# ==============================

# Compile the user's program
[[test.compile_steps]]
program = "cargo"
args = ["build", "--release", "--target-dir", "./target"]

# Remove the old binary
[[test.compile_steps]]
program = "rm"
args = ["-rf", "./ahc072"]

# Move the compiled binary to the current directory
[[test.compile_steps]]
program = "cp"
args = ["./target/release/a", "./ahc072"]

# On macOS, there’s a possibility of SIGKILL or other issues occurring,
# so it’s better to build the visualizer in advance
# rather than running it with cargo run every time.

# Compile the visualizer
[[test.compile_steps]]
program = "cargo"
args = ["build", "--release", "--bin", "vis", "--target-dir", "./target"]
current_dir = "./tools"

# Remove the old visualizer
[[test.compile_steps]]
program = "rm"
args = ["-f", "./vis"]

# Copy the visualizer to the current directory
[[test.compile_steps]]
program = "cp"
args = ["./tools/target/release/vis", "./vis"]

# ==============================
#           TEST STEPS
# ==============================

# Run the user's program
[[test.test_steps]]
program = "./ahc072"
args = []
stdin = "./tools/in/{SEED04}.txt"
stdout = "./tools/out/{SEED04}.txt"
stderr = "./tools/err/{SEED04}.txt"
measure_time = true

# Validate the output and calculate the score
[[test.test_steps]]
program = "./vis"
args = ["./tools/in/{SEED04}.txt", "./tools/out/{SEED04}.txt", "--no-vis"]
measure_time = false
